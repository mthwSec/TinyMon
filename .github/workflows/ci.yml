# Checks every push to main and every pull request: formatting, lints and
# tests in both feature sets, with the toolchain that rust-toolchain.toml pins,
# then the release build and its checks, so that a size or privacy regression
# shows up before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt, clippy, tests and the release checks
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy without default features
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Tests without default features
        run: cargo test --locked --no-default-features

      - name: Release build and checks
        run: ./scripts/build-release.ps1 -TargetDir "$env:RUNNER_TEMP/release"
